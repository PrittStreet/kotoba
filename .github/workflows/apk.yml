name: APK

# Builds the Android app on every push that touches it; on main, also publishes it on the Releases page,
# so the latest version is always at releases/latest/download/kotoba.apk.
on:
  push:
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and lint
        working-directory: android
        run: ./gradlew assembleRelease lintRelease --no-daemon
      - name: Collect the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk kotoba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-apk
          path: kotoba.apk
      - name: Publish on the Releases page
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" kotoba.apk \
            --target "${{ github.sha }}" \
            --title "Kotoba (build ${{ github.run_number }})" \
            --notes "Ouvre kotoba.apk depuis le téléphone pour installer Kotoba ou le mettre à jour (l'historique, les favoris et la clé sont conservés)." \
            --latest
