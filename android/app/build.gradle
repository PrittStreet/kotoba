plugins {
    id 'com.android.application'
}

// Each build gets a higher version code (minutes since 2026-01-01 UTC), so a new APK always installs over the old one.
def buildMinutes = (int) ((System.currentTimeMillis().intdiv(1000L) - 1767225600L).intdiv(60L))
def buildDate = new Date().format('yyyy-MM-dd', TimeZone.getTimeZone('UTC'))

// Optional key built into a private APK for friends, from android/kotoba-secrets.properties
// (apiKey=…, workspace=…). That file is git-ignored: CI builds and public releases have no key.
def secrets = new Properties()
def secretsFile = rootProject.file('kotoba-secrets.properties')
if (secretsFile.exists()) secretsFile.withInputStream { secrets.load(it) }

android {
    namespace 'io.github.prittstreet.kotoba'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.prittstreet.kotoba'
        minSdk 26
        targetSdk 36
        versionCode buildMinutes
        versionName "1.0 (${buildDate})"
        buildConfigField 'String', 'API_KEY', "\"${secrets.getProperty('apiKey', '').trim()}\""
        buildConfigField 'String', 'WORKSPACE', "\"${secrets.getProperty('workspace', '').trim()}\""
        // phones only: the text recognition's native code is 11 MB per processor type
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // The same key signs every build, so updates install over the previous version and keep its data.
    signingConfigs {
        kotoba {
            storeFile file('../kotoba.keystore')
            storePassword 'kotoba-apk'
            keyAlias 'kotoba'
            keyPassword 'kotoba-apk'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.kotoba
        }
        debug {
            signingConfig signingConfigs.kotoba
        }
    }

    // The app itself is the static web page in /web, served from the APK's assets.
    sourceSets {
        main {
            assets.srcDirs += ['../../web']
        }
    }

    // native code compressed in the APK: a smaller download
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.webkit:webkit:1.17.1'
    // camera live: the camera, and the Japanese read on the phone itself (offline model in the APK)
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'androidx.camera:camera-mlkit-vision:1.6.2'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
}
